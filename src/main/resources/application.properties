spring.application.name=internship-management-api

# ----------------------------------------------------------------------
# MySQL database configuration
# Replace YOUR_PASSWORD with your local MySQL root password before running.
# Do NOT commit a real password to source control.
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/internship_management
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080
